.step-m .mini-bar{width:180px}
.step-s{font-size:12px;color:var(--muted-fg);text-transform:capitalize}
.soon{display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 24px;gap:6px}.soon h3{margin:10px 0 0;font-size:17px}.soon p{margin:0;max-width:440px;color:var(--text2)}
.set-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}

.av.lg{width:52px;height:52px;font-size:17px}
.set-n{display:flex;flex-direction:column;gap:14px;padding:16px 20px}
/* chat */
.chat{display:grid;grid-template-columns:260px minmax(0,1fr);width:100%;height:100%;min-height:0}
.ch-side{border-right:1px solid var(--border);background:#fff;padding:14px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.ch-new{margin:0 4px 10px}
.ch-g{margin:6px 10px 4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-fg)}
.ch-i{display:flex;flex-direction:column;gap:3px;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;font:inherit;min-width:0}
.ch-i:hover,.ch-i.on{background:var(--accent)}.ch-i .trunc{font-weight:500}
.ch-m{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted-fg)}
.ch-main{display:flex;flex-direction:column;min-height:0;min-width:0}
.ch-top{display:flex;gap:10px;align-items:baseline;padding:14px 24px;border-bottom:1px solid var(--border);background:#fff}
.ch-thread{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:18px;max-width:860px;width:100%;margin:0 auto}
.ch-thread>*{flex-shrink:0}
.msg{display:flex;gap:10px;animation:fadeUp .3s both}
.msg.user{justify-content:flex-end}.msg.user p{margin:0;background:var(--primary);color:#fff;padding:9px 14px;border-radius:14px 14px 4px 14px;max-width:70%}
.ai-mark{width:28px;height:28px;border-radius:9px;background:var(--violet-soft);color:var(--violet);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.msg-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.msg-t{margin:0;font-size:13.5px;line-height:1.6;color:var(--sec-fg);text-wrap:pretty}.msg-t b{color:var(--fg)}
.tool{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);background:var(--bg);border:1px solid var(--hair);border-radius:8px;padding:4px 9px;align-self:flex-start}
.ans-l{display:flex;flex-direction:column;gap:6px}
.ans-l li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#fff;animation:fadeUp .35s both}
.ans-l li>span{flex:1;min-width:0}.ans-l b{font-weight:500}
.cite{width:20px;height:20px;border-radius:6px;border:1px solid #c7d1f4;background:var(--primary-soft);color:var(--primary);font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0;padding:0}.cite:hover{background:var(--primary);color:#fff}
.cc-w{max-width:560px}
.cc{border:1px solid var(--border);border-radius:12px;background:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.cc-h{display:flex;gap:12px;align-items:center}.cc-h>div{display:flex;flex-direction:column}.cc-h b{font-size:15px}.cc-h span{font-size:12.5px;color:var(--text2)}
.cc-f{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;margin:0;font-size:12.5px}.cc-f dt{color:var(--muted-fg)}.cc-f dd{margin:0;min-width:0}
.cc-plan{background:var(--bg);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--text2)}.cc-plan b{color:var(--fg)}
.cc-ft{border-top:1px solid var(--hair);padding-top:10px}
.ok-t{display:inline-flex;align-items:center;gap:6px;color:var(--success);font-weight:500}
.cc-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.cc-row>div{display:flex;flex-direction:column;min-width:0}.cc-row span{font-size:12.5px}
.cc-stats{display:flex;gap:16px;font-size:12.5px;color:var(--muted-fg)}.cc-stats b{color:var(--fg)}
.ch-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin:auto 0;padding:40px 0}.ch-empty h2{margin:10px 0 0;font-size:22px;font-weight:600;letter-spacing:-.02em}.ch-empty p{margin:0;color:var(--text2);max-width:440px}
.ch-sug{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-top:18px;width:100%;max-width:620px}
.ch-fu{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 24px 8px;max-width:860px;margin:0 auto}
.fu{border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 11px;font:inherit;font-size:12.5px;color:var(--sec-fg);cursor:pointer}.fu:hover{border-color:var(--primary);color:var(--primary)}
.composer{display:flex;gap:8px;align-items:flex-end;margin:0 auto 18px;width:calc(100% - 48px);max-width:812px;border:1px solid var(--border);border-radius:14px;background:#fff;padding:8px 8px 8px 14px;box-shadow:0 4px 14px rgba(16,24,40,.06)}
.composer:focus-within{border-color:var(--primary)}
.composer textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:13.5px;line-height:1.5;padding:6px 0;max-height:140px;background:transparent}
.composer .btn{width:34px;padding:0;justify-content:center}
.rc .tbl td:first-child{min-width:0}.rc-t,.rc-tt{min-width:240px}
.rc-t{display:flex;flex-direction:column;min-width:0;max-width:440px}.rc-t b{font-weight:600}.rc-t span{font-size:12px;color:var(--muted-fg)}
.rc-tt{display:block;max-width:520px;text-wrap:pretty}.fw5{font-weight:500}
.ind-s{display:inline-flex;height:22px;align-items:center;padding:0 8px;border-radius:999px;background:var(--success-soft);color:var(--success);font-size:12px;font-weight:600;white-space:nowrap}
.tag.lb{background:var(--danger-soft);color:var(--danger)}
.doc-ic{width:26px;height:26px;border-radius:7px;background:var(--muted);color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rc-dist{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:14px 20px 4px}
.rc-dl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-fg)}
.rc-bar{display:flex;gap:2px;height:8px;flex:1 1 200px;border-radius:4px;overflow:hidden;min-width:160px}.rc-bar i{display:block;transition:flex-grow .4s}
.rc-leg{display:flex;flex-wrap:wrap;gap:4px}
.rc-lg{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 7px;font:inherit;font-size:12px;color:var(--sec-fg);cursor:pointer}.rc-lg:hover{background:var(--accent)}.rc-lg.on{border-color:var(--primary);background:var(--primary-soft)}
.rc-lg b{width:8px;height:8px;border-radius:2px}.rc-lg em{font-style:normal;color:var(--muted-fg);font-size:11px}
.rc-bar2{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 20px}
.as-q.sm{height:32px;flex:1 1 240px;max-width:360px}
.sel{height:32px;border:1px solid var(--border);border-radius:8px;background:#fff;font:inherit;padding:0 8px;color:var(--sec-fg);cursor:pointer}
.rc-ev{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--primary)}.rc-ev i{width:7px;height:7px;border-radius:50%}
.tr-dot.inl{display:inline-block;margin-right:6px;vertical-align:1px}
.rc-in{animation:fadeUp .35s both}
.rc-dl2{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.rc-link{border:1px solid var(--border);border-radius:12px;padding:12px}
@media (max-width:900px){.chat{grid-template-columns:minmax(0,1fr)}.ch-side{display:none}.ch-thread{padding:16px}}
