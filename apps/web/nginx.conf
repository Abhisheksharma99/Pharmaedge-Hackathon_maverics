server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # Security headers. nginx drops inherited add_header lines in a location that sets its own, so the two
  # locations below that set Cache-Control include them again.
  include /etc/nginx/security-headers.conf;

  # API on the same origin, so the SameSite=Strict session cookies work.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr; # overwrite: a client-sent header must not reach the API
    proxy_set_header X-Forwarded-Proto $scheme;
    # Asset AI streams responses; don't buffer them.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # Hashed build files (vite build.assetsDir = "static").
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # Everything else is a client-side route.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
  }
}
