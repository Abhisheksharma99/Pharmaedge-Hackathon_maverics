# Self-hosted MongoDB: single-node replica set (mongot syncs through change streams, which need one),
# SCRAM auth, TLS required on every connection. The keyfile and server certificate are written into
# tmpfs at start by start-mongod.sh from infra/mongo/secrets/mongo.env.
net:
  port: 27017
  bindIpAll: true
  tls:
    mode: requireTLS
    certificateKeyFile: /run/mongo/server.pem
    CAFile: /etc/mongo/ca.pem
    # Clients authenticate with passwords, not client certificates.
    allowConnectionsWithoutCertificates: true
    disabledProtocols: TLS1_0,TLS1_1

replication:
  replSetName: rs0

security:
  authorization: enabled
  keyFile: /run/mongo/keyfile

# mongot (search + vector search) on the internal Docker network only.
setParameter:
  searchIndexManagementHostAndPort: mongot:27028
  mongotHost: mongot:27028
  skipAuthenticationToSearchIndexManagementServer: false
  useGrpcForSearch: true
  searchTLSMode: disabled
