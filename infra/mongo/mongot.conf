# mongot: MongoDB Search / Vector Search for Community Edition. Syncs from mongod as the `mongot`
# user (searchCoordinator role); its gRPC port is reachable only inside the Docker network.
syncSource:
  replicaSet:
    hostAndPort: "mongo:27017"
    scramAuth:
      username: "mongot"
      passwordFile: "/run/mongot/passwordFile"
      authSource: "admin"
      tls:
        enabled: true
        caFile: "/etc/mongot/ca.pem"

storage:
  dataPath: "/data/mongot"

server:
  grpc:
    address: "0.0.0.0:27028"
    tls:
      mode: "disabled"

metrics:
  enabled: false

healthCheck:
  address: "0.0.0.0:8080"

logging:
  verbosity: INFO
